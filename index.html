                        <main>
                            <div class="create-note" id="noteContainer">
                                <div class="title hidden" id="titleBlock">
                                    <input class="title-input" type="text" name="title" placeholder="Title">
                                </div>
                                <textarea class="note-input" placeholder="Your Note" rows="1"></textarea>
                                    <div class="note-actions">        
                                        <div id="addPhoto"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M13 6H13.01M1 14L6 9.00001C6.928 8.10701 8.072 8.10701 9 9.00001L14 14M12 12L13 11C13.928 10.107 15.072 10.107 16 11L19 14M1 4C1 3.20435 1.31607 2.44129 1.87868 1.87868C2.44129 1.31607 3.20435 1 4 1H16C16.7956 1 17.5587 1.31607 18.1213 1.87868C18.6839 2.44129 19 3.20435 19 4V16C19 16.7956 18.6839 17.5587 18.1213 18.1213C17.5587 18.6839 16.7956 19 16 19H4C3.20435 19 2.44129 18.6839 1.87868 18.1213C1.31607 17.5587 1 16.7956 1 16V4Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg></div>                
                            <div class="button hidden" id="createBlock">
                                <span class="button-create">Create</span>
                            </div>
                                    </div>
                            </div>
                                <div id="cleanBtn" class="hidden">
                                    <span id="emptyBasket">Empty basket</span>
                                </div>
                                <div id="notesContainer">
                                        <div id="pinnedSection" class="hidden">
                                            <h4 class="section-title">Pinned</h4>
                                            <div id="pinnedWrapper" class="notes-grid"></div>
                                        </div>
                                        <div id="otherSection">
                                            <h4 id="othersTitle" class="section-title hidden">Other</h4>
                                            <div id="notesWrapper" class="notes-grid"></div>
                                            <div id="emptyContainer" class="hidden">
                                                <span id="emptyText">Here will be your notes</span>
                                            </div>
                                        </div>
                                    </div>
                            </div>
                        </main>
                    <div id="noteModal" class=" modal hidden">
                        <div class="modal-content">
                            <input type="text" id="modalTitle" class="modal-title" placeholder="Title">
                            <textarea id="modalText" class="modal-text" placeholder="Text"></textarea>
                            <div class="modal-footer">
                                <span id="modalTimestamp" class="modal-timestamp"></span>
                                <span id="saveModal" class="modal-save-btn">Close</span>
                            </div>
                        </div>
                    </div>
                    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
